# Continuous integration: every component is tested on every push and pull request.
# The Windows jobs exercise real screen capture and the tray application.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (includes a real RFC 3161 TSA built with OpenSSL)
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s python/tests -v 2>&1 | tee python-tests.log
      - name: Report failures as annotations
        if: failure()
        shell: bash
        run: python tests/ci_annotate.py failures python-tests.log
      - name: Package installs and exposes the chainshot command
        shell: bash
        run: |
          python -m pip install ./python
          chainshot --version
      - name: Vectors are up to date
        if: runner.os == 'Linux'
        run: |
          python tests/vectors/make_vectors.py
          git diff --exit-code tests/vectors/
      - name: Every component has the same version number
        if: runner.os == 'Linux'
        run: python tests/check_versions.py

  powershell:
    name: PowerShell ${{ matrix.shell }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, shell: powershell }   # Windows PowerShell 5.1
          - { os: windows-latest, shell: pwsh }         # PowerShell 7
          - { os: ubuntu-latest,  shell: pwsh }         # journal features on Linux
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      CHAINSHOT_TEST_OUT: ${{ github.workspace }}/test-output
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Pester 5
        run: |
          New-Item -ItemType Directory -Force -Path $env:CHAINSHOT_TEST_OUT | Out-Null
          Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck
      - name: Static analysis (errors only)
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path windows -Recurse -Severity Error
          $issues | Format-Table -AutoSize
          if ($issues) { throw "PSScriptAnalyzer found $($issues.Count) error(s)" }
      - name: Pester tests
        run: |
          Import-Module Pester -MinimumVersion 5.5.0
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'windows/tests'
          $cfg.Run.PassThru = $true
          $cfg.Output.Verbosity = 'Detailed'
          $r = Invoke-Pester -Configuration $cfg
          # Summary and failures as annotations (readable through the GitHub API).
          $skipped = ($r.Tests | Where-Object Result -eq 'Skipped' | ForEach-Object Name) -join '; '
          "::notice title=Pester $($PSVersionTable.PSVersion) on $([Environment]::OSVersion.VersionString)::passed=$($r.PassedCount) failed=$($r.FailedCount) skipped=$($r.SkippedCount) [$skipped]"
          foreach ($t in ($r.Tests | Where-Object Result -eq 'Failed')) {
            $msg = ($t.ErrorRecord | ForEach-Object { $_.Exception.Message + ' ' + $_.ScriptStackTrace }) -join ' | '
            "::error title=$($t.ExpandedName)::$($msg -replace "`r?`n", '%0A')"
          }
          if ($r.FailedCount -gt 0) { exit 1 }
      - name: Preview of a capture taken on the runner (annotation)
        if: always() && runner.os == 'Windows'
        run: |
          python -m pip install --quiet pillow
          $png = Get-ChildItem -Recurse -Filter *.png $env:CHAINSHOT_TEST_OUT | Where-Object { $_.Directory.Name -eq 'captures' } | Select-Object -First 1
          if ($png) { python tests/ci_annotate.py thumbnail $png.FullName "Capture preview ${{ matrix.shell }}" }
      - name: Upload test cases (screenshots taken on the runner)
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.shell }}-test-cases
          path: test-output
          if-no-files-found: ignore
          retention-days: 7

  app:
    name: Windows app (ChainShot.exe)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v4   # also reports compiler errors as annotations
        with:
          dotnet-version: '8.0.x'
      - name: Build (.NET Framework 4.8, C# 7.3, warnings are errors)
        run: dotnet build app/ChainShot.csproj -c Release -nologo
      - name: End-to-end tests (captures, interop with chainshot.py and the module, RFC 3161, window)
        run: |
          python -m pip install --quiet pillow
          python tests/app_e2e.py app/bin/Release/ChainShot.exe --out test-output
      # Annotations keep at most 10 notices per step: one step per image part.
      - name: Preview App window 1/3
        if: always()
        run: if (Test-Path test-output/app-demo.png) { python tests/ci_annotate.py thumbnail test-output/app-demo.png 'App window' full 1/3 }
      - name: Preview App window 2/3
        if: always()
        run: if (Test-Path test-output/app-demo.png) { python tests/ci_annotate.py thumbnail test-output/app-demo.png 'App window' full 2/3 }
      - name: Preview App window 3/3
        if: always()
        run: if (Test-Path test-output/app-demo.png) { python tests/ci_annotate.py thumbnail test-output/app-demo.png 'App window' full 3/3 }
      - name: Preview App altered case 1/3
        if: always()
        run: if (Test-Path test-output/app-altered.png) { python tests/ci_annotate.py thumbnail test-output/app-altered.png 'App altered case' full 1/3 }
      - name: Preview App altered case 2/3
        if: always()
        run: if (Test-Path test-output/app-altered.png) { python tests/ci_annotate.py thumbnail test-output/app-altered.png 'App altered case' full 2/3 }
      - name: Preview App altered case 3/3
        if: always()
        run: if (Test-Path test-output/app-altered.png) { python tests/ci_annotate.py thumbnail test-output/app-altered.png 'App altered case' full 3/3 }
      - name: Preview App new case 1/2
        if: always()
        run: if (Test-Path test-output/shots/app-new-case.png) { python tests/ci_annotate.py thumbnail test-output/shots/app-new-case.png 'App new case' full 1/2 }
      - name: Preview App new case 2/2
        if: always()
        run: if (Test-Path test-output/shots/app-new-case.png) { python tests/ci_annotate.py thumbnail test-output/shots/app-new-case.png 'App new case' full 2/2 }
      - name: Preview App tray menu 1/1
        if: always()
        run: if (Test-Path test-output/shots/app-tray-menu.png) { python tests/ci_annotate.py thumbnail test-output/shots/app-tray-menu.png 'App tray menu' full 1/1 }
      - name: Preview of a capture banner
        if: always()
        run: |
          $png = Get-ChildItem -Filter *.png test-output/case-app/captures -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($png) { python tests/ci_annotate.py thumbnail $png.FullName 'App capture banner' }
      - name: Upload ChainShot.exe (try it before the release)
        uses: actions/upload-artifact@v4
        with:
          name: chainshot-app-exe
          path: |
            app/bin/Release/ChainShot.exe
            app/bin/Release/ChainShot.exe.config
          retention-days: 14
      - name: Upload test cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-cases
          path: test-output
          if-no-files-found: ignore
          retention-days: 7

  extension:
    name: Browser extension (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: End-to-end tests (capture, files on disk, verification by chainshot.py)
        shell: bash
        run: |
          set -o pipefail
          npm run test:extension 2>&1 | tee extension-tests.log
      - name: Report failures as annotations
        if: failure()
        shell: bash
        run: python tests/ci_annotate.py failures extension-tests.log
