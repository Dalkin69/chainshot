# Publishes site/ to GitHub Pages (Settings > Pages > Source: GitHub Actions).
# The README illustrations in docs/img are copied at build time, so the site and the
# repository always show the same screenshots.
name: Website

on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/img/**', 'extension/icons/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        env:
          GOOGLE: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          BING: ${{ vars.BING_SITE_VERIFICATION }}
        run: |
          mkdir -p _site/img
          cp -r site/* _site/
          cp docs/img/*.png extension/icons/icon128.png _site/img/
          # Search engine ownership tags, from repository variables (Settings > Secrets and
          # variables > Actions > Variables): GOOGLE_SITE_VERIFICATION, BING_SITE_VERIFICATION.
          # Each variable may hold the bare token, the whole <meta> tag, or (Google "HTML file"
          # method) the file content "google-site-verification: googleXXXX.html".
          token() { printf '%s' "$1" | sed -E 's/.*content="([^"]*)".*/\1/' | tr -d '\r\n "<>'; }
          tags=""
          if [ -n "$GOOGLE" ]; then
            gfile=$(printf '%s' "$GOOGLE" | grep -oE 'google[0-9a-f]+\.html' | head -1 || true)
            if [ -n "$gfile" ]; then
              printf 'google-site-verification: %s' "$gfile" > "_site/$gfile"
              echo "Google verification file: $gfile"
            else
              tags="$tags<meta name=\"google-site-verification\" content=\"$(token "$GOOGLE")\">"
            fi
          fi
          if [ -n "$BING" ]; then tags="$tags<meta name=\"msvalidate.01\" content=\"$(token "$BING")\">"; fi
          if [ -n "$tags" ]; then sed -i "s|<meta charset=\"utf-8\">|<meta charset=\"utf-8\">$tags|" _site/index.html; fi
          # Custom domain: put it in site/CNAME (and in the repository settings).
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
