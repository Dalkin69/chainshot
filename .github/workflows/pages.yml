# Publishes site/ to GitHub Pages (Settings > Pages > Source: GitHub Actions).
# The README illustrations in docs/img are copied at build time, so the site and the
# repository always show the same screenshots.
name: Website

on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/img/**', 'extension/icons/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir -p _site/img
          cp -r site/* _site/
          cp docs/img/*.png extension/icons/icon128.png _site/img/
          # Custom domain: put it in site/CNAME (and in the repository settings).
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
