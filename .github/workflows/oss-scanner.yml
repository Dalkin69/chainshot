# Checks that the image used by Anthropic's OSS Scanner (.oss-scanner/Dockerfile) builds, and that
# the tests run inside it without network access, as the scanner does.
name: OSS Scanner image

on:
  push:
    branches: ['**']
    paths: ['.oss-scanner/**', 'python/**', 'app/**', 'windows/**', '.github/workflows/oss-scanner.yml']
  pull_request:
    paths: ['.oss-scanner/**', 'python/**', 'app/**', 'windows/**', '.github/workflows/oss-scanner.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the image (network allowed, like the scanner)
        run: docker build --progress=plain -f .oss-scanner/Dockerfile -t chainshot-scan . 2>&1 | tee build.log
      - name: Tests inside the image, without network
        run: |
          set -o pipefail
          docker run --rm --network none chainshot-scan sh -c '
            set -e
            python -m unittest discover -s python/tests 2>&1 | tail -3
            chainshot --version
            test -f app/bin/Release/ChainShot.exe && echo "ChainShot.exe built"
            pwsh -NoProfile -Command "Import-Module ./windows/ChainShot/ChainShot.psd1; (Get-Module ChainShot).Version.ToString()"'
      - name: Summary
        if: always()
        run: |
          p=$(grep -o 'Pester: [0-9]* passed, [0-9]* failed, [0-9]* skipped' build.log | tail -1)
          w=$(grep -c 'WARNING:' build.log || true)
          echo "::notice title=OSS Scanner image::${p:-Pester summary not found}; warnings during build: ${w}"
