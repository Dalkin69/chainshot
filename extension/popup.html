<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ChainShot</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="" width="24" height="24">
    <div>
      <h1>ChainShot</h1>
      <p id="caseLine" class="muted">No case</p>
    </div>
  </header>

  <div class="seg" role="group" aria-label="Where captures are saved">
    <button id="destDownloads" data-dest="downloads" title="Case folder in your Downloads folder, managed by the extension">This browser</button>
    <button id="destApp" data-dest="app" title="The case open in the ChainShot app (Windows) or chainshot.py">ChainShot app</button>
  </div>

  <section id="appLink" class="card" hidden>
    <p id="appText"></p>
    <p class="muted small">Windows: start <b>ChainShot.exe</b> once; it registers the link (Options &gt; Browser link).
      Linux, macOS: <code>python3 chainshot.py register-browser</code>, then <code>chainshot.py use &lt;case&gt;</code>.</p>
    <button id="retryApp" class="link">Try again</button>
  </section>

  <section id="newCase" hidden>
    <h2>New case</h2>
    <label>Case name or reference<input id="caseName" placeholder="TP Forensic - PC-COMPTA01" autocomplete="off"></label>
    <label>Examiner<input id="examiner" placeholder="Your name" autocomplete="off"></label>
    <div class="row">
      <button id="createCase" class="primary">Create case</button>
      <button id="cancelCase" class="ghost">Cancel</button>
    </div>
    <p class="muted small">Files are saved in your Downloads folder under <code>ChainShot/</code>.</p>
  </section>

  <section id="main" hidden>
    <div class="grid">
      <label>Tag<input id="tag" placeholder="P17" autocomplete="off"></label>
      <label id="caseSelectLabel">Case<select id="caseSelect"></select></label>
    </div>
    <div class="opts">
      <label class="check" title="Scrolls the page and stitches the parts into one image"><input type="checkbox" id="fullPage"> Full page</label>
      <label class="check" id="archiveRow" title="Also saves the page as an MHTML file, hashed and chained"><input type="checkbox" id="archive"> Page archive (MHTML)</label>
    </div>
    <label>Note <span class="muted">(used once, then cleared)</span><textarea id="note" rows="2" placeholder="What this capture shows"></textarea></label>
    <div class="row">
      <button id="capture" class="primary">Capture tab <kbd id="shortcut">Alt+Shift+S</kbd></button>
      <button id="logNote" class="ghost" title="Add the note to the journal without a capture">Log note</button>
    </div>
    <div id="last" class="card" hidden></div>
    <div class="row tools">
      <button id="verify" class="link">Verify chain</button>
      <button id="rewrite" class="link browser-only">Rewrite journal file</button>
      <button id="showNewCase" class="link browser-only">New case</button>
    </div>
    <p id="folder" class="muted small"></p>
  </section>

  <p id="message" role="status"></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
